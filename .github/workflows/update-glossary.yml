name: Update glossary

on:
  schedule:
    # Weekly on Thursday 08:00 UTC, after typical Wednesday patch windows.
    - cron: "0 8 * * 4"
  workflow_dispatch:

concurrency:
  group: update-glossary
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Data Dragon
        run: python generate_lol_glossary.py

      - name: Read patch version
        id: patch
        run: |
          python -c "import json; print('version=' + json.load(open('data/metadata.json', encoding='utf-8'))['version'])" >> "$GITHUB_OUTPUT"

      - name: Open pull request if data changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Update LoL glossary data to patch ${{ steps.patch.outputs.version }}
          title: Update glossary to patch ${{ steps.patch.outputs.version }}
          body: |
            ## Summary
            - Refresh English / Korean / 繁體中文 glossary data from Riot Data Dragon
            - Patch **${{ steps.patch.outputs.version }}**

            ## Test plan
            - [ ] Spot-check a champion, item, and rune on the site
          branch: chore/data-dragon-update
          delete-branch: true
          add-paths: |
            data/
            docs/data/
            docs/index.html
